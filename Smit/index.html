<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <img src="assets/taha.png" alt="" width="200" height="90">
        <h1>Registration Form-SMIT</h1>
        <h2>Service-Education-Registration</h2>
    </center>
    <label for="user-country">Select Country</label>
    <select name="user-country" id="user-country">
        <option value="Pakistan">pakistan</option>
        <option value="India">india</option>
        <option value="Afghanistan">Afghanistan</option>
        <option value="Iran">Iran</option>
        <option value="China">China</option>
        <option value="USA">USA</option>
        <option value="UK">UK</option>
        <option value="UAE">UAE</option>
        <option value="Saudi Arabia">Saudi Arabia</option>
    </select> <br>
    <label for="user-city">Select your city</label>
    <select name="user-city" id="user-city">
        <option value="Karachi">Karachi</option>
        <option value="Lahore">Lahore</option>
        <option value="Islmabad">Islmabad</option>
        <option value="Peshawar">Peshawar</option>
        <option value="Quetta">Quetta</option>
        <option value="Faisalabad">Faisalabad</option>
        <option value="Muitan">Muitan</option>
        <option value="hyderabad">hyderabad</option>
        <option value="Sialkot">Sialkot</option>
    </select> <br>
    <label for="user-gender">Select your gender</label>
    <input type="radio" name="gender">
    Male
    <input type="radio" name="gender"> 
    Female <br>
    <label for="user-course">Select your course</label> <br>
    <select name="user-course" id="user-course">
        <option value="Web Development">Web Development</option>
        <option value="Mobile App Development">Mobile App Development</option>
        <option value="Data Science">Data Science</option>
        <option value="Cyber Security">Cyber Security</option>
        <option value="Digital Marketing">Digital Marketing</option>
        <option value="Graphic Designing">Graphic Designing</option>
        <option value="UI/UX Designing">UI/UX Designing</option>
        <option value="Cloud Computing">Cloud Computing</option>
        <option value="AI & ML">AI & ML</option> 
    </select>
    <label for="user-name">Full Name</label> <br>
    <input type="text" name="user-name" placeholder="Enter your Full name">
    <label for="user-Father-name">Father name</label> <br>
    <input type="text" name=" user-Father-name" placeholder="Enter your father name">
    <label for="user-phone">Phone No.</label> <br>
    <input type="text" name="user-phone" placeholder="Enter your Phone number"> 
    <label for="user-email">Enter Email</label> <br>
    <input type="text" name="user-email" placeholder="Enter your email">
    <label for="user-CNIC">Enter CNIC</label> <br>
    <input type="text" name="user-CNIC" placeholder="Enter your CNIC"> <br>
    <label for="user-Father-CNIC">Enter father CNIC</label> <br>
    <input type="text" name="user-Father-CNIC" placeholder="Enter your father CNIC">
    <label for="user-DOB">Date of birth</label> <br>
    <input type="date" name="user-DOB" placeholder="Enter your date of birth">
    <label for="user-last-Qualification">Last Qualification</label> <br>
    <input type="text" name="user-last-Qualification" placeholder="Enter your Last Qualification">
    <label for="user-address">Address</label> <br>
    <input type="text" name="user-address" placeholder="Enter your Address">
    <label for="user-picture">Picture</label> <br>
    <input type="file" name="Choose file">
</body>
</body>
</html>
